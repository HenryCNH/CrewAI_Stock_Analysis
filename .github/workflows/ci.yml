name: Tests and publication safety

"on":
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

env:
  CREWAI_TELEMETRY_DISABLED: "true"
  OTEL_SDK_DISABLED: "true"
  DO_NOT_TRACK: "1"

jobs:
  tests:
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest]
        python: ["3.10", "3.11", "3.12", "3.13"]
        include:
          - os: windows-latest
            python: "3.12"
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: ${{ matrix.python }}
      - name: Install project and test dependencies
        run: python -m pip install -e ".[dev]"
      - name: Run offline tests
        run: python -m pytest
      - name: Build and inspect distributions
        if: matrix.os == 'ubuntu-latest' && matrix.python == '3.12'
        run: |
          python -m pip install build
          python -m build
          python scripts/check_publication.py --archives dist
      - name: Smoke-test wheel installation outside checkout
        if: matrix.os == 'ubuntu-latest' && matrix.python == '3.12'
        shell: bash
        run: |
          set -euo pipefail
          python -m venv --system-site-packages "$RUNNER_TEMP/wheel-smoke"
          "$RUNNER_TEMP/wheel-smoke/bin/python" -m pip install --no-deps dist/*.whl
          cd "$RUNNER_TEMP"
          "$RUNNER_TEMP/wheel-smoke/bin/python" -c "from importlib.resources import files; config = files('scratch_project') / 'config'; assert (config / 'agents.yaml').is_file(); assert (config / 'tasks.yaml').is_file()"
          "$RUNNER_TEMP/wheel-smoke/bin/stock-brief" --help

  publication:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: "3.12"
      - name: Reject private or unreviewed indexed paths
        run: python scripts/check_publication.py
      - name: Export candidate publication contents
        run: python scripts/check_publication.py --staged-snapshot "${{ runner.temp }}/publication-snapshot"
      - name: Install verified Gitleaks release
        shell: bash
        working-directory: ${{ runner.temp }}
        run: |
          set -euo pipefail
          version=8.30.1
          archive="gitleaks_${version}_linux_x64.tar.gz"
          base="https://github.com/gitleaks/gitleaks/releases/download/v${version}"
          curl --fail --silent --show-error --location --output "$archive" "$base/$archive"
          curl --fail --silent --show-error --location --output checksums.txt "$base/gitleaks_${version}_checksums.txt"
          grep "  ${archive}$" checksums.txt | sha256sum --check --status
          tar -xzf "$archive" gitleaks
      - name: Scan publication snapshot and reachable Git history
        shell: bash
        run: |
          set -euo pipefail
          "$RUNNER_TEMP/gitleaks" dir --redact --no-banner "$RUNNER_TEMP/publication-snapshot"
          "$RUNNER_TEMP/gitleaks" git --redact --no-banner --log-opts="--all" .
