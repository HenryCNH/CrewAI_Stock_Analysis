[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "crewai-stock-analysis"
version = "0.1.0"
description = "A beginner-friendly CrewAI project for evidence-aware stock briefs."
readme = "README.md"
requires-python = ">=3.10,<3.14"
dependencies = [
    "crewai[litellm]>=1.0,<2.0",
    "python-dotenv>=1.0,<2.0",
    "yfinance>=0.2.54,<1.0",
]

[project.optional-dependencies]
dev = ["pytest>=7.4,<9.0"]

[project.scripts]
stock-brief = "scratch_project.main:main"

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
scratch_project = ["config/*.yaml"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
